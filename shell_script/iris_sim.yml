name: iris_sim
root: ./
startup_window: iris_sim
windows:
  - simulation:
      layout: tiled
      panes:
        - |
            cd ~/PX4-Autopilot
            make px4_sitl gz_x500_mono_cam_down
        - |
            cd ~
            ./QGroundControl-x86_64.AppImage
        - |
            sleep 7
            gz service -s /world/default/create   --reqtype gz.msgs.EntityFactory   --reptype gz.msgs.Boolean   --timeout 2000   --req 'sdf_filename: "/home/lukn23/ros2_ws/src/iris_land/misc/landpad/landpad.sdf", name: "landpad", pose: {position: {x: 2, y: 2, z: 0}}'
            ros2 run rqt_image_view rqt_image_view
            
  - mavros:
      layout: tiled
      panes:
        - |
            sleep 5
            ros2 launch mavros px4.launch fcu_url:="udp://:14540@127.0.0.1:14557"
        - |
            sleep 5
            ros2 run ros_gz_bridge parameter_bridge \
                /world/default/model/x500_mono_cam_down_0/link/camera_link/sensor/imager/image@sensor_msgs/msg/Image[gz.msgs.Image \
                /world/default/model/x500_mono_cam_down_0/link/camera_link/sensor/imager/camera_info@sensor_msgs/msg/CameraInfo[gz.msgs.CameraInfo \
                --ros-args \
                -r /world/default/model/x500_mono_cam_down_0/link/camera_link/sensor/imager/image:=/rgb_camera/image_raw \
                -r /world/default/model/x500_mono_cam_down_0/link/camera_link/sensor/imager/camera_info:=/rgb_camera/camera_info
  # - echo:
  #     layout: tiled
  #     panes:
  #       - rostopic echo /mavros/state
  #       - rostopic echo /mavros/extended_state
  #       - rostopic echo /mavros/rc/in
  # - magni:
  #     layout: tiled
  #     panes:
  #       - roslaunch magni_gazebo teste.launch
  - rgb_detect:
      layout: tiled
      panes:
        - sleep 8; ros2 run iris_land aruco_rgb.py
  - manager:
      layout: tiled
      panes:
        - sleep 7; ros2 run iris_land joy_node.py
        - sleep 7; ros2 run iris_land parameters_node.py
        - sleep 10; ros2 run iris_land iris_mng
        