name: iris_real
root: ./
startup_window: flight
windows:
  - image_transport:
      layout: tiled
      panes:
        #- sleep 1; roslaunch mavros px4.launch #executa pacote MAVROS
        #- sleep 1; rqt_image_view
         - sleep 1; rosrun iris_land stereo_camera_publisher_node #abre a camera sterea
         - sleep 1; roslaunch iris_land aruco_stereo.launch
        #- sleep 1; rosrun seekcamera_ros get_seekthermal.py #abre a camera termica
        #- sleep 1; rosrun iris_land aruco_node.py #executa pacote aruco da camera termica
         - sleep 1; roslaunch uwb_tracking_ros uwb_tracking_dwm1001.launch #executa pacote do modulo uwb
  - ekf:
      layout: tiled
      panes:
         - sleep 8; roslaunch drone_ekf ekf.launch

  - manager:
      layout: tiled
      panes:
       
        - sleep 3; rosrun iris_land parameters_node.py
        - sleep 3; rosrun iris_land iris_mng
